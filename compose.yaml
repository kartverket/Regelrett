name: Regelrett

services:
  regelrett-db:
    image: postgres:15.4
    container_name: regelrett-db
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
      - POSTGRES_DB=regelrett
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d regelrett"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  regelrett:
    build: .
    ports:
      - 8080:8080
    environment:
      - RR_AIRTABLE_ACCESS_TOKEN
      - RR_OAUTH_TENANT_ID
      - RR_OAUTH_CLIENT_ID
      - RR_OAUTH_CLIENT_SECRET
      - RR_DATABASE_HOST=regelrett-db:5432
    volumes:
      - type: bind
        target: /etc/regelrett/provisioning
        source: ./conf/provisioning/
    depends_on:
      regelrett-db:
        condition: service_healthy
        restart: true
