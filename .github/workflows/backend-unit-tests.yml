name: Backend Unit Tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'conf/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/backend-unit-tests.yml'
  push:
    branches:
      - main
      - release-*.*.*
    paths:
      - 'backend/**'
      - 'conf/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/backend-unit-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  regelrett:
    name: Regelrett
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup gradle
      uses: gradle/actions/setup-gradle@v6.4.0
    - name: Restore Gradle Cache
      uses: actions/cache@v6
      with:
        key: gradle-test-cache-${{ github.ref_name }}
        restore-keys: |
          gradle-test-cache-${{ github.base_ref }}
          gradle-test-cache-main
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
    - name: Run unit tests
      working-directory: backend
      run: ./gradlew test --no-daemon

